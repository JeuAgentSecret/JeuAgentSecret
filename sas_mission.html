<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LE SAS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        .play-btn:active { transform: scale(0.95); }

        /* Console Simon */
        .simon-box {
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .simon-status {
            font-size: 0.85rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            min-height: 24px;
        }

        .simon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 240px;
        }

        .simon-btn {
            height: 100px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.15s ease, transform 0.1s ease;
            outline: none;
        }

        .simon-btn:active { transform: scale(0.95); }

        .btn-red { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        .btn-blue { background: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .btn-green { background: #22c55e; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .btn-yellow { background: #eab308; box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }

        .simon-btn.lit { opacity: 1; filter: brightness(1.3); transform: scale(1.02); }

        .start-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .start-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 4 / 8</span>
            <h1>LE SAS</h1>
        </div>

        <!-- Briefing Audio -->
        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - SAS</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/SAS_INTRO.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Mini-Jeu Simon -->
        <div class="simon-box">
            <div class="simon-status" id="status-text">APPUYEZ SUR LNCER</div>

            <div class="simon-grid">
                <button class="simon-btn btn-red" id="b-0" onclick="handleUserClick(0)"></button>
                <button class="simon-btn btn-blue" id="b-1" onclick="handleUserClick(1)"></button>
                <button class="simon-btn btn-green" id="b-2" onclick="handleUserClick(2)"></button>
                <button class="simon-btn btn-yellow" id="b-3" onclick="handleUserClick(3)"></button>
            </div>

            <button class="start-btn" id="start-btn" onclick="startGame()">LANCER LA SÉQUENCE</button>
        </div>
    </div>

    <script>
        const NEXT_PAGE_URL = "sas_mission2.html";

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        // Logic Simon
        const rounds = [
            [0, 2],           // Vague 1 : 2 éléments
            [0, 2, 1],        // Vague 2 : 3 éléments
            [0, 2, 1, 3]      // Vague 3 : 4 éléments
        ];

        let currentRound = 0;
        let userStep = 0;
        let isPlayingSequence = false;
        let gameActive = false;

        const statusText = document.getElementById('status-text');
        const startBtn = document.getElementById('start-btn');

        function startGame() {
            currentRound = 0;
            userStep = 0;
            gameActive = true;
            startBtn.style.display = 'none';
            playRound();
        }

        function playRound() {
            userStep = 0;
            isPlayingSequence = true;
            statusText.textContent = `OBSERVEZ... (${currentRound + 1}/3)`;
            statusText.style.color = "#f59e0b";

            const sequence = rounds[currentRound];
            let i = 0;

            const interval = setInterval(() => {
                flashButton(sequence[i]);
                i++;
                if (i >= sequence.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        isPlayingSequence = false;
                        statusText.textContent = "À VOUS ! REPRODUISEZ";
                        statusText.style.color = "#3b82f6";
                    }, 500);
                }
            }, 600);
        }

        function flashButton(index) {
            const btn = document.getElementById(`b-${index}`);
            btn.classList.add('lit');
            setTimeout(() => {
                btn.classList.remove('lit');
            }, 350);
        }

        function handleUserClick(index) {
            if (!gameActive || isPlayingSequence) return;

            flashButton(index);
            const expected = rounds[currentRound][userStep];

            if (index === expected) {
                userStep++;
                if (userStep >= rounds[currentRound].length) {
                    currentRound++;
                    if (currentRound >= rounds.length) {
                        // Réussite totale !
                        statusText.textContent = "🟢 SÉQUENCE VALIDÉE !";
                        statusText.style.color = "#22c55e";
                        gameActive = false;
                        setTimeout(() => {
                            window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
                        }, 800);
                    } else {
                        // Vague suivante
                        isPlayingSequence = true;
                        statusText.textContent = "✔ REUSSITE ! VAGUE SUIVANTE...";
                        statusText.style.color = "#22c55e";
                        setTimeout(() => {
                            playRound();
                        }, 1000);
                    }
                }
            } else {
                // Erreur
                statusText.textContent = "❌ ERREUR ! RÉESSAYEZ";
                statusText.style.color = "#ef4444";
                gameActive = false;
                startBtn.style.display = 'block';
                startBtn.textContent = "RECOMMENCER";
            }
        }
    </script>
</body>
</html>
