<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA SALLE DE BAIN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        .mirror-box {
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: 18px;
            overflow: hidden;
            border: 2px solid rgba(148, 163, 184, 0.3);
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid #3b82f6;
            color: #60a5fa;
            border-radius: 50%;
            width: 90px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }

        .scanner-btn:active { transform: scale(0.9); }

        .scanner-text {
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        #fogCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            touch-action: none;
        }

        .instruction {
            font-size: 0.8rem;
            color: #94a3b8;
            text-align: center;
            font-weight: 600;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 5 / 8</span>
            <h1>LA SALLE DE BAIN</h1>
        </div>

        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - SDB</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/SDB.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="instruction" id="instruction-text">👈 NETTOYEZ LA BUÉE AVEC VOTRE DOIGT</div>

        <div class="mirror-box">
            <div class="scanner-btn" id="scan-trigger">
                🖐️
                <span class="scanner-text">SCANNER</span>
            </div>
            <canvas id="fogCanvas"></canvas>
        </div>
    </div>

    <script>
        const NEXT_PAGE_URL = "sdb_mission2.html";

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        const canvas = document.getElementById('fogCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const instructionText = document.getElementById('instruction-text');
        const scanTrigger = document.getElementById('scan-trigger');
        let isDrawing = false;
        let isCleared = false;
        let scanInterval;

        function initCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            ctx.fillStyle = 'rgba(148, 163, 184, 0.92)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 16px -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.textAlign = 'center';
            ctx.fillText('MIROIR EMBUE', canvas.width / 2, canvas.height / 2);
        }

        window.addEventListener('load', initCanvas);

        function scratch(e) {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 35, 0, Math.PI * 2, false);
            ctx.fill();
        }

        // On vérifie UNIQUEMENT le centre du canvas (là où est le scanner) toutes les 500ms
        function checkCenterCleared() {
            if (isCleared) return;

            // Dimensions de la zone centrale à vérifier (autour du bouton scanner)
            const checkSize = 60; 
            const centerX = (canvas.width / 2) - (checkSize / 2);
            const centerY = (canvas.height / 2) - (checkSize / 2);

            const imageData = ctx.getImageData(centerX, centerY, checkSize, checkSize);
            const pixels = imageData.data;
            let transparentPixels = 0;

            // On vérifie tous les pixels de ce petit carré central
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] < 50) transparentPixels++; // Si l'alpha est très faible (effacé)
            }

            const totalPixels = pixels.length / 4;
            
            // Si la zone centrale est dégagée à 40% minimum
            if (transparentPixels / totalPixels > 0.4) {
                isCleared = true;
                instructionText.textContent = "✅ SCANNER DÉGAGÉ ! APPUYEZ SUR L'EMPREINTE";
                instructionText.style.color = "#22c55e";
                
                // On laisse passer les clics à travers le canvas pour pouvoir cliquer sur le scanner en dessous
                canvas.style.pointerEvents = 'none'; 
                clearInterval(scanInterval);
            }
        }

        canvas.addEventListener('mousedown', (e) => { 
            isDrawing = true; 
            scratch(e); 
            scanInterval = setInterval(checkCenterCleared, 500); 
        });
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => { 
            isDrawing = false; 
            clearInterval(scanInterval);
            checkCenterCleared(); 
        });

        canvas.addEventListener('touchstart', (e) => { 
            isDrawing = true; 
            scratch(e); 
            scanInterval = setInterval(checkCenterCleared, 500);
        }, {passive: true});
        canvas.addEventListener('touchmove', scratch, {passive: true});
        window.addEventListener('touchend', () => { 
            isDrawing = false; 
            clearInterval(scanInterval);
            checkCenterCleared(); 
        });

        // Validation lors du clic sur le scanner (possible uniquement quand pointer-events: none est activé sur le canvas)
        function validateScan() {
            window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
        }

        scanTrigger.addEventListener('click', validateScan);
        scanTrigger.addEventListener('touchend', (e) => {
            e.preventDefault();
            validateScan();
        });
    </script>
</body>
</html>
