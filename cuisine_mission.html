<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission Secrète - La Cuisine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        .play-btn:active { transform: scale(0.95); }

        .enigma-box {
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .enigma-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .enigma-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            outline: none;
        }

        .enigma-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .submit-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .submit-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 2 / 8</span>
            <h1>LA CUISINE</h1>
        </div>

        <!-- Briefing Audio -->
        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - CUISINE</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/CUISINE.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Zone Saisie Code -->
        <div class="enigma-box">
            <div class="enigma-title">Saisir l'ingrédient secret</div>
            <input type="text" id="answer-input" class="enigma-input" placeholder="MOT CODE" autocomplete="off">
            <button class="submit-btn" onclick="checkAnswer()">Valider le Code</button>
        </div>
    </div>

    <script>
        const SECRET_ANSWER = "CAFE";
        const NEXT_PAGE_URL = "cuisine_mission2.html"; // Redirige vers la page d'affichage du puzzle

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        function checkAnswer() {
            const input = document.getElementById('answer-input').value.trim().toUpperCase();
            
            if (input === SECRET_ANSWER) {
                window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
            } else {
                alert("❌ CODE INCORRECT. Recherchez bien dans la cuisine !");
            }
        }
    </script>
</body>
</html>
