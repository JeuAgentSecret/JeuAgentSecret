<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission Secrète - La Cuisine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        .play-btn:active { transform: scale(0.95); }

        /* Formulaire de validation de l'énigme */
        .enigma-box {
            background: #020617;
            border: 2px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .enigma-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(15, 23, 42, 0.9);
            color: white;
            font-size: 1.1rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
        }

        .submit-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Plateau de Puzzle (2 x 4) */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 110px);
            gap: 8px;
            background: #020617;
            padding: 12px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .puzzle-slot {
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .puzzle-slot.unlocked {
            border: 2px solid #3b82f6;
            background-image: url('https://jeuagentsecret.github.io/JeuAgentSecret/Images/rose.jpg');
            background-size: 200% 400%;
        }

        /* Placement désordonné des pièces */
        .piece-1 { background-position: 100% 100%; }
        .piece-2 { background-position: 0% 33.33%; }

        .puzzle-slot.locked { color: #64748b; font-size: 1.5rem; }

        .slot-number {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
        }

        .puzzle-slot.unlocked .slot-number {
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 2 / 8</span>
            <h1>LA CUISINE</h1>
        </div>

        <!-- Audio Player -->
        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - CUISINE</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/CUISINE.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Mini-Jeu / Énigme -->
        <div class="enigma-box" id="enigma-box">
            <div style="font-size: 0.8rem; color: #94a3b8;">ENTREZ L'INGRÉDIENT SECRET</div>
            <input type="text" id="answer-input" class="enigma-input" placeholder="Ex: JAMBON" autocomplete="off">
            <button class="submit-btn" onclick="checkAnswer()">DÉVERROUILLER LA PIÈCE 2</button>
        </div>

        <!-- Plateau de Puzzle (2 x 4) -->
        <div class="puzzle-grid">
            <div class="puzzle-slot unlocked piece-1"><span class="slot-number">1</span></div>
            <!-- La pièce 2 s'activera dynamiquement lors de la bonne réponse -->
            <div class="puzzle-slot locked" id="slot-2"><span class="slot-number">2</span>🔒</div>
            
            <div class="puzzle-slot locked"><span class="slot-number">3</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">4</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">5</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">6</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">7</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">8</span>🔒</div>
        </div>
    </div>

    <script>
        const SECRET_ANSWER = "CAFE"; // Ton mot-clé personnalisé
        const NEXT_PAGE_URL = "salon_mission.html"; // Nom de l'étape 3

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        function checkAnswer() {
            const input = document.getElementById('answer-input').value.trim().toUpperCase();
            const slot2 = document.getElementById('slot-2');
            
            if (input === SECRET_ANSWER) {
                alert("🔓 INGRÉDIENT CONFIRMÉ ! Pièce 2 débloquée.");
                
                // Débloque la pièce 2 visuellement
                slot2.classList.remove('locked');
                slot2.classList.add('unlocked', 'piece-2');
                slot2.innerHTML = '<span class="slot-number">2</span>';

                // Redirection vers la zone 3 après 2 secondes
                setTimeout(() => {
                    window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
                }, 2000);
            } else {
                alert("❌ CODE INCORRECT. Inspectez bien la cuisine !");
            }
        }
    </script>
</body>
</html>
