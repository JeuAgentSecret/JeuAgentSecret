<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission Secrète - La Terrasse</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        .play-btn:active { transform: scale(0.95); }

        /* Interface de piratage */
        .hack-box {
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hack-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            color: #cbd5e1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
            box-shadow: 0 0 6px #ef4444;
        }

        .status-dot.active {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #1e293b;
            height: 8px;
            border-radius: 4px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 3 / 8</span>
            <h1>LA TERRASSE</h1>
        </div>

        <!-- Briefing Audio -->
        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - TERRASSE</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/TERRASSE.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Jeu de Piratage Laser -->
        <div class="hack-box">
            <div class="hack-title">DÉSACTIVER LES LASERS DE SÉCURITÉ</div>

            <!-- Laser 1 (Cible : 80%) -->
            <div class="slider-group">
                <div class="slider-label">
                    <span>LASER ALPHA</span>
                    <span id="dot-1" class="status-dot"></span>
                </div>
                <input type="range" id="slider1" min="0" max="100" value="10" oninput="checkSliders()">
            </div>

            <!-- Laser 2 (Cible : 30%) -->
            <div class="slider-group">
                <div class="slider-label">
                    <span>LASER BETA</span>
                    <span id="dot-2" class="status-dot"></span>
                </div>
                <input type="range" id="slider2" min="0" max="100" value="90" oninput="checkSliders()">
            </div>

            <!-- Laser 3 (Cible : 60%) -->
            <div class="slider-group">
                <div class="slider-label">
                    <span>LASER GAMMA</span>
                    <span id="dot-3" class="status-dot"></span>
                </div>
                <input type="range" id="slider3" min="0" max="100" value="0" oninput="checkSliders()">
            </div>
        </div>
    </div>

    <script>
        const NEXT_PAGE_URL = "terrasse_mission2.html";

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        function checkSliders() {
            const v1 = parseInt(document.getElementById('slider1').value);
            const v2 = parseInt(document.getElementById('slider2').value);
            const v3 = parseInt(document.getElementById('slider3').value);

            // Cibles autorisées avec une petite marge d'erreur (+/- 5)
            const target1 = Math.abs(v1 - 80) <= 5;
            const target2 = Math.abs(v2 - 30) <= 5;
            const target3 = Math.abs(v3 - 60) <= 5;

            document.getElementById('dot-1').className = target1 ? "status-dot active" : "status-dot";
            document.getElementById('dot-2').className = target2 ? "status-dot active" : "status-dot";
            document.getElementById('dot-3').className = target3 ? "status-dot active" : "status-dot";

            // Si les 3 curseurs sont bien calés : Succès !
            if (target1 && target2 && target3) {
                setTimeout(() => {
                    window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
                }, 600);
            }
        }
    </script>
</body>
</html>
