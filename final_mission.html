<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA MISSION FINALE</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ec4899;
            --primary-hover: #db2777;
            --accent: #8b5cf6;
            --bg-grad-1: #0f172a;
            --bg-grad-2: #1e1b4b;
            --card-bg: rgba(255, 255, 255, 0.08);
            --border-color: rgba(255, 255, 255, 0.15);
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #f472b6, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
            font-size: 1.05rem;
        }

        /* Controls bar */
        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .stat-badge {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .stat-badge span {
            color: #f8fafc;
            font-weight: 700;
        }

        /* Puzzle Board - Grille 2x4 */
        .board-wrapper {
            position: relative;
            padding: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            width: 340px;
            height: 560px;
            max-width: 90vw;
            max-height: 75vh;
        }

        .tile {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid transparent;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), border-color 0.2s, box-shadow 0.2s;
            background-repeat: no-repeat;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .tile:hover {
            transform: scale(0.97);
            border-color: rgba(244, 114, 182, 0.6);
        }

        .tile.selected {
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.8);
            transform: scale(1.03);
            z-index: 10;
            animation: pulse 1.2s infinite alternate;
        }

        .tile-number {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(15, 23, 42, 0.7);
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.6); }
            100% { box-shadow: 0 0 28px rgba(56, 189, 248, 1); }
        }

        /* Modal Preview & Victory */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid var(--border-color);
        }

        .victory-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #4ade80;
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>L'Ultime Épreuve du Puzzle</h1>
            <p>Interchange les 8 morceaux pour reconstituer l'image de la rose !</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <button class="btn" id="previewBtn">
                <i class="fa-solid fa-eye"></i> Modèle
            </button>
            <button class="btn" id="shuffleBtn">
                <i class="fa-solid fa-shuffle"></i> Mélanger
            </button>
            <label for="imageUpload" class="btn">
                <i class="fa-solid fa-image"></i> Changer l'image
            </label>
            <input type="file" id="imageUpload" accept="image/*">

            <div class="stat-badge">
                Échanges : <span id="moveCount">0</span>
            </div>
        </div>

        <!-- Puzzle Grid (8 Tiles - Grille 2x4) -->
        <div class="board-wrapper">
            <div class="puzzle-grid" id="puzzleGrid"></div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal" id="previewModal">
        <div class="modal-content">
            <h2 style="color: #f8fafc;">Image Modèle</h2>
            <img id="previewImg" src="" alt="Modèle">
            <button class="btn" style="margin: 0 auto; background: var(--primary);" id="closePreview">Fermer</button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal" id="victoryModal">
        <div class="modal-content">
            <div class="victory-title">🎉 VICTOIRE !</div>
            <img id="victoryImg" src="" alt="Image Complète">
            <p style="color: #f472b6; font-weight: 600; font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px;">
                Bravo, vous avez réussi toutes les épreuves, vous pouvez maintenant demander votre récompense au propriétaire des lieux !
            </p>
            <button class="btn" style="margin: 0 auto; background: linear-gradient(135deg, #10b981, #059669); padding: 12px 30px; font-size: 1.1rem;" id="restartBtn">
                Rejouer
            </button>
        </div>
    </div>

    <script>
        // Image de base (rose.jpg hébergée)
        let imageUrl = "https://jeuagentsecret.github.io/JeuAgentSecret/Images/rose.jpg";

        // Dimensions de la grille 2x4 (2 colonnes, 4 lignes = 8 morceaux)
        const COLS = 2;
        const ROWS = 4;
        const TOTAL_TILES = COLS * ROWS; // 8

        let currentOrder = []; 
        let selectedIndex = null; 
        let moves = 0;

        const puzzleGrid = document.getElementById('puzzleGrid');
        const moveCountDisplay = document.getElementById('moveCount');
        const previewModal = document.getElementById('previewModal');
        const victoryModal = document.getElementById('victoryModal');
        const previewImg = document.getElementById('previewImg');
        const victoryImg = document.getElementById('victoryImg');

        // Audio Effects (Web Audio API synth-based)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'select') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'swap') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.frequency.setValueAtTime(freq, now + i * 0.12);
                    noteGain.gain.setValueAtTime(0.2, now + i * 0.12);
                    noteGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.4);
                    noteOsc.start(now + i * 0.12);
                    noteOsc.stop(now + i * 0.12 + 0.4);
                });
            }
        }

        // Initialize Puzzle
        function initGame() {
            moves = 0;
            selectedIndex = null;
            moveCountDisplay.innerText = moves;
            previewImg.src = imageUrl;
            victoryImg.src = imageUrl;

            currentOrder = Array.from({ length: TOTAL_TILES }, (_, i) => i);
            shuffleArray(currentOrder);

            renderBoard();
        }

        function shuffleArray(array) {
            let isSolved = true;
            while (isSolved) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                isSolved = array.every((val, idx) => val === idx);
            }
        }

        // Render the 8 Tiles in Grid (2x4)
        function renderBoard() {
            puzzleGrid.innerHTML = '';

            currentOrder.forEach((tilePieceIndex, gridPos) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                if (selectedIndex === gridPos) {
                    tile.classList.add('selected');
                }

                const origCol = tilePieceIndex % COLS;
                const origRow = Math.floor(tilePieceIndex / COLS);

                const posX = (origCol / (COLS - 1)) * 100;
                const posY = (origRow / (ROWS - 1)) * 100;

                tile.style.backgroundImage = `url('${imageUrl}')`;
                tile.style.backgroundSize = `${COLS * 100}% ${ROWS * 100}%`;
                tile.style.backgroundPosition = `${posX}% ${posY}%`;

                const numBadge = document.createElement('div');
                numBadge.className = 'tile-number';
                numBadge.innerText = gridPos + 1;
                tile.appendChild(numBadge);

                tile.addEventListener('click', () => handleTileClick(gridPos));
                puzzleGrid.appendChild(tile);
            });
        }

        function handleTileClick(gridPos) {
            if (selectedIndex === null) {
                selectedIndex = gridPos;
                playSound('select');
                renderBoard();
            } else if (selectedIndex === gridPos) {
                selectedIndex = null;
                playSound('select');
                renderBoard();
            } else {
                swapTiles(selectedIndex, gridPos);
                selectedIndex = null;
                moves++;
                moveCountDisplay.innerText = moves;
                playSound('swap');
                renderBoard();
                checkWin();
            }
        }

        function swapTiles(pos1, pos2) {
            const temp = currentOrder[pos1];
            currentOrder[pos1] = currentOrder[pos2];
            currentOrder[pos2] = temp;
        }

        function checkWin() {
            const hasWon = currentOrder.every((val, index) => val === index);
            if (hasWon) {
                setTimeout(() => {
                    playSound('win');
                    triggerConfetti();
                    victoryModal.classList.add('active');
                }, 300);
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        document.getElementById('imageUpload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imageUrl = event.target.result;
                    initGame();
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('shuffleBtn').addEventListener('click', initGame);
        document.getElementById('previewBtn').addEventListener('click', () => previewModal.classList.add('active'));
        document.getElementById('closePreview').addEventListener('click', () => previewModal.classList.remove('active'));
        document.getElementById('restartBtn').addEventListener('click', () => {
            victoryModal.classList.remove('active');
            initGame();
        });

        window.addEventListener('click', (e) => {
            if (e.target === previewModal) previewModal.classList.remove('active');
            if (e.target === victoryModal) victoryModal.classList.remove('active');
        });

        initGame();
    </script>
</body>
</html>
