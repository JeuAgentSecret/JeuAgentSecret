<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA CHAMBRE PRINCIPALE 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffffff;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4ade80;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            outline: none;
            width: 100%;
        }

        .puzzle-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin: 0; 
        }

        .piece { 
            aspect-ratio: 1/1;
            background: rgba(34, 197, 94, 0.15); 
            border: 2px solid #22c55e; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.75rem;
            font-weight: 700;
            color: #4ade80;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">MISSION RÉUSSIE</span>
            <h1>CHAMBRE PRINCIPALE</h1>
        </div>

        <div class="audio-card">
            <div class="audio-title">🎙️ DÉBRIEFING DE VICTOIRE</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE MESSAGE
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/PRINCIPALE2.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="puzzle-grid">
            <div class="piece">1</div>
            <div class="piece">2</div>
            <div class="piece">3</div>
            <div class="piece">4</div>
            <div class="piece">5</div>
            <div class="piece">6</div>
            <div class="piece">7</div>
            <div class="piece">8</div>
        </div>

        <a href="final_mission.html" class="action-btn">CONTINUER VERS LE JEU FINAL</a>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        window.onload = () => {
            audioPlayer.play().then(() => {
                btnPlay.innerHTML = "⏸️ PAUSE";
            }).catch(e => {
                console.log("Lecture automatique bloquée par le navigateur");
            });
        };
    </script>
</body>
</html>
