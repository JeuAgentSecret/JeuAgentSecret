<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA CHAMBRE D'AMI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            outline: none;
        }

        /* Radio Tuner Box */
        .radio-box {
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .freq-display {
            font-family: monospace;
            font-size: 2rem;
            font-weight: 900;
            color: #ef4444;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .freq-display.locked {
            color: #22c55e;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.8);
        }

        .signal-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .signal-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e);
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .slider-control {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            height: 10px;
            border-radius: 5px;
            background: #1e293b;
            outline: none;
        }

        .slider-control::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.6);
        }

        .status-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 7 / 8</span>
            <h1>CHAMBRE D'AMI</h1>
        </div>

        <!-- Briefing Audio -->
        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - CHAMBRE D'AMI</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/CHAMBREAMI.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Mini-Jeu Radio -->
        <div class="radio-box">
            <div class="status-label" id="status-text">RECHERCHE DE FRÉQUENCE</div>
            <div class="freq-display" id="freq-text">88.0 MHz</div>

            <div class="signal-bar-container">
                <div class="signal-bar" id="signal-bar"></div>
            </div>

            <input type="range" min="880" max="1080" value="880" class="slider-control" id="radio-slider" oninput="updateRadio(this.value)">
        </div>
    </div>

    <script>
        const NEXT_PAGE_URL = "chambreami_mission2.html";
        const TARGET_FREQ = 1042; // Target: 104.2 MHz

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        const freqText = document.getElementById('freq-text');
        const signalBar = document.getElementById('signal-bar');
        const statusText = document.getElementById('status-text');
        
        let holdTimer = 0;
        let isSuccess = false;

        function updateRadio(val) {
            if (isSuccess) return;

            const mhz = (val / 10).toFixed(1);
            freqText.textContent = `${mhz} MHz`;

            // Calcul de la précision par rapport à la fréquence cible (104.2)
            const diff = Math.abs(val - TARGET_FREQ);
            const signalQuality = Math.max(0, 100 - (diff * 2.5));

            signalBar.style.width = `${signalQuality}%`;

            if (diff <= 2) {
                freqText.classList.add('locked');
                statusText.textContent = "SIGNAL VERROUILLÉ ! MAINTENEZ...";
                statusText.style.color = "#22c55e";
                
                holdTimer++;
                if (holdTimer >= 8) { // Stabilisation pendant ~1 seconde
                    isSuccess = true;
                    statusText.textContent = "🟢 FRÉQUENCE VALIDÉE !";
                    setTimeout(() => {
                        window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
                    }, 600);
                }
            } else {
                freqText.classList.remove('locked');
                statusText.textContent = "RECHERCHE DE FRÉQUENCE";
                statusText.style.color = "#94a3b8";
                holdTimer = 0;
            }
        }
    </script>
</body>
</html>
