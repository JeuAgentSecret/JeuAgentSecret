<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mission Secrète - Étape 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
        }

        .badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #93c5fd;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease;
            outline: none;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* Puzzle Grid (2 colonnes x 4 lignes) */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 110px);
            gap: 8px;
            background: #020617;
            padding: 12px;
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        .puzzle-slot {
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Pièce 1 : Découpe CSS dynamique de rose.jpg */
        .puzzle-slot.unlocked {
            border: 2px solid #3b82f6;
            background-image: url('https://jeuagentsecret.github.io/JeuAgentSecret/Images/rose.jpg');
            background-size: 200% 400%; /* Grille 2x4 */
            background-position: 0% 0%;   /* Coin Haut-Gauche */
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        .puzzle-slot.locked {
            color: #64748b;
            font-size: 1.5rem;
        }

        .slot-number {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.4);
        }

        .puzzle-slot.unlocked .slot-number {
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            border-radius: 6px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 2 / 8</span>
            <h1>LA CUISINE</h1>
        </div>

        <!-- Audio Player -->
        <div class="audio-card">
            <div class="audio-title">🎙️ BRIEFING VOCAL - ZONE 2</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER LE BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source id="audio-source" src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/ENTREE2.mp3" type="audio/mpeg">
                Votre navigateur ne supporte pas l'élément audio.
            </audio>
        </div>

        <!-- Plateau de Puzzle (2 x 4) -->
        <div class="puzzle-grid">
            <!-- Case 1 : Pièce 1 Débloquée -->
            <div class="puzzle-slot unlocked">
                <span class="slot-number">1</span>
            </div>

            <!-- Cases 2 à 8 : Verrouillées -->
            <div class="puzzle-slot locked"><span class="slot-number">2</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">3</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">4</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">5</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">6</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">7</span>🔒</div>
            <div class="puzzle-slot locked"><span class="slot-number">8</span>🔒</div>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        window.addEventListener('load', () => {
            audioPlayer.play().then(() => {
                btnPlay.innerHTML = "⏸️ PAUSE";
            }).catch(err => {
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            });
        });

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play().then(() => {
                    btnPlay.innerHTML = "⏸️ PAUSE";
                }).catch(err => {
                    alert("Erreur de lecture audio.");
                });
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
            }
        }

        audioPlayer.onended = function() {
            btnPlay.innerHTML = "▶️ ÉCOUTER LE BRIEFING";
        };
    </script>
</body>
</html>
