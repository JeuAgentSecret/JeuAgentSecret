<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LA CHAMBRE PRINCIPALE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(88, 28, 135, 0.4) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header { text-align: center; }

        .badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .audio-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
        }

        .audio-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fca5a5;
            letter-spacing: 0.5px;
        }

        .play-btn {
            background: linear-gradient(135deg, #ef4444, #991b1b);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            outline: none;
            width: 100%;
        }

        /* Zone de jeu intégrée */
        .game-box {
            background: #020617;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            min-height: 220px;
            overflow: hidden;
        }

        .status-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        #game-area {
            position: relative;
            width: 100%;
            height: 140px;
        }

        .target {
            position: absolute;
            width: 42px;  /* Taille réduite */
            height: 42px; /* Taille réduite */
            background: radial-gradient(circle, #ef4444, #991b1b);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            animation: pulse 0.4s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(0.9); }
            to { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">ZONE 8/8 - URGENCE</span>
            <h1>Réacteur Instable</h1>
        </div>

        <!-- Briefing Audio -->
        <div class="audio-card">
            <div class="audio-title">🎙️ RÉACTEUR INSTABLE</div>
            <button class="play-btn" id="btn-play" onclick="toggleAudio()">
                ▶️ ÉCOUTER BRIEFING
            </button>
            <audio id="audio-player" preload="auto">
                <source src="https://jeuagentsecret.github.io/JeuAgentSecret/Audios/PRINCIPALE.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- Mini-Jeu Cibles -->
        <div class="game-box">
            <div class="status-label" id="score-text">Cibles à neutraliser : <span id="count">5</span>/5</div>
            <div id="game-area"></div>
        </div>
    </div>

    <script>
        const NEXT_PAGE_URL = "principale_mission2.html";
        const TOTAL_TARGETS = 5;
        let score = TOTAL_TARGETS;

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');

        function toggleAudio() {
            if (audioPlayer.paused) {
                audioPlayer.play();
                btnPlay.innerHTML = "⏸️ PAUSE";
            } else {
                audioPlayer.pause();
                btnPlay.innerHTML = "▶️ ÉCOUTER BRIEFING";
            }
        }

        audioPlayer.onended = () => {
            btnPlay.innerHTML = "▶️ ÉCOUTER BRIEFING";
        };

        const area = document.getElementById('game-area');
        const countSpan = document.getElementById('count');

        function spawnTarget() {
            if (score <= 0) {
                window.location.href = NEXT_PAGE_URL + "?v=" + new Date().getTime();
                return;
            }

            // Nettoyage de la cible précédente
            area.innerHTML = '';

            const t = document.createElement('div');
            t.className = 'target';

            // Taille de la cible (42px) prise en compte pour éviter les dépassements
            const targetSize = 42;
            const maxX = Math.max(0, area.clientWidth - targetSize);
            const maxY = Math.max(0, area.clientHeight - targetSize);
            
            // Position aléatoire sur toute la zone
            t.style.left = Math.floor(Math.random() * maxX) + 'px';
            t.style.top = Math.floor(Math.random() * maxY) + 'px';

            // Clic réussi sur la cible
            t.onclick = () => {
                score--;
                countSpan.innerText = score;
                t.remove();
                spawnTarget();
            };

            area.appendChild(t);

            // Disparition automatique après 1.2s si non cliquée pour relancer une nouvelle position
            setTimeout(() => {
                if (t.parentElement) {
                    t.remove();
                    if (score > 0) {
                        spawnTarget();
                    }
                }
            }, 1200);
        }

        // Lancement de la première cible
        spawnTarget();
    </script>
</body>
</html>
